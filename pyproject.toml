[project]
name = "synoptic-wind-xml"
version = "0.1.0"
description = "Export wind observations from Synoptic weather stations into QES-Winds sensor files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pyproj==3.7.2",
    "python-dotenv==1.2.3",
    "questionary==2.1.1",
    "requests==2.34.2",
]

[project.scripts]
synoptic-wind-xml = "synoptic_wind_xml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synoptic_wind_xml"]
